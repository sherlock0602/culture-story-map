<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神話時空地圖 - 大字體護眼版</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --geo-dark: #1a1510;          
      --geo-panel: rgba(26, 21, 19, 0.85); 
      --geo-gold: #c69c6d;          
      --geo-gold-bright: #e2b04a;   
      --geo-text-main: #eaddca;     
      --geo-text-sub: #a6917c;      
      --geo-border: rgba(198, 156, 109, 0.4);
    }

    body { font-family: "Georgia", "Microsoft JhengHei", serif; background-color: #f0f8ff; display: flex; height: 100vh; overflow: hidden; color: var(--geo-text-main); }
    .main-container { display: flex; width: 100%; height: 100vh; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; cursor: default; z-index: 1;}
    .map-edit-mode { cursor: crosshair !important; border: 4px dashed var(--geo-gold-bright); }
    .leaflet-tile { opacity: 1; }

    .river-label { background: transparent !important; border: none !important; box-shadow: none !important; font-weight: bold; font-size: 0.9rem; pointer-events: none; }
    .geo-label, .custom-text-label div { 
      background: transparent !important; border: none !important; box-shadow: none !important; 
      color: #1e293b; font-weight: 900; font-size: 0.8rem; 
      text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0px 2px 4px rgba(0,0,0,0.4);
      white-space: nowrap; pointer-events: none; 
    }
    .leaflet-tooltip-left::before, .leaflet-tooltip-right::before, .leaflet-tooltip-top::before, .leaflet-tooltip-bottom::before { display: none !important; }
    .custom-text-label.country-huge div { font-size: 1rem; color: #0f172a; }
    .glow-path { filter: drop-shadow(0px 0px 3px currentColor); transition: fill-opacity 0.3s, fill-color 0.3s; }

    .map-zoom-2 .size-medium, .map-zoom-2 .size-small, .map-zoom-2 .manual-province-label, .map-zoom-3 .size-medium, .map-zoom-3 .size-small, .map-zoom-3 .manual-province-label { display: none !important; }
    .map-zoom-4 .size-small, .map-zoom-4 .manual-province-label { display: none !important; }
    .map-zoom-5 .country-huge, .map-zoom-6 .country-huge, .map-zoom-7 .country-huge, .map-zoom-8 .country-huge { display: none !important; }

    .top-left-panel { position: absolute; left: 20px; top: 20px; z-index: 1000; background: var(--geo-panel); backdrop-filter: blur(12px); border: 1px solid var(--geo-border); border-radius: 12px; padding: 15px 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; width: 110px; }
    .category-badge { background: rgba(0,0,0,0.6); color: #48cae4; border: 1px solid #48cae4; padding: 6px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; cursor: pointer; user-select: none; transition: 0.3s; text-align: center; line-height: 1.2; width: 100%;}
    .category-badge:hover { transform: scale(1.05); }
    .icon-controls { display: flex; gap: 6px; width: 100%; justify-content: center; }
    .icon-btn { background: rgba(0,0,0,0.4); color: var(--geo-gold); border: 1px solid var(--geo-border); width: 28px; height: 28px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover, .icon-btn.active { background: var(--geo-gold); color: var(--geo-dark); border-color: var(--geo-gold-bright);}

    .vertical-timeline-container { position: absolute; left: 20px; top: 110px; bottom: 30px; z-index: 1000; background: var(--geo-panel); backdrop-filter: blur(12px); border: 1px solid var(--geo-border); border-radius: 12px; padding: 20px 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; width: 110px; }
    .timeline-scroll-area { flex: 1; width: 100%; margin-bottom: 15px; padding-right: 2px; overflow-y: auto; }
    .timeline-scroll-area::-webkit-scrollbar { width: 4px; }
    .timeline-scroll-area::-webkit-scrollbar-thumb { background: var(--geo-gold); border-radius: 2px;}
    .timeline-track { position: relative; height: 600px; display: flex; justify-content: center; width: 100%; transition: height 0.3s ease; }
    input[type=range][orient=vertical] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 4px; height: 100%; accent-color: var(--geo-gold-bright); cursor: pointer; background: rgba(0,0,0,0.6); border-radius: 5px; }
    .timeline-labels { position: absolute; left: 55%; height: 100%; width: 40px; pointer-events: none; }
    .timeline-labels span { position: absolute; transform: translateY(50%); font-size: 0.75rem; font-weight: bold; color: var(--geo-text-sub); white-space: nowrap; }
    #currentEraDisplay { font-size: 0.85rem; font-weight: bold; color: var(--geo-gold-bright); text-align: center; }
    #currentYearDisplay { font-size: 0.75rem; color: var(--geo-text-main); text-align: center; margin-top: 5px; }

    .ppt-controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: var(--geo-panel); backdrop-filter: blur(10px); border: 1px solid var(--geo-border); padding: 8px 25px; border-radius: 30px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .ppt-btn { background: transparent; color: var(--geo-gold-bright); border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1.1rem; }
    .ppt-btn:hover { color: #fff; transform: scale(1.1); }
    .ppt-status { color: var(--geo-text-main); font-weight: bold; font-size: 0.9rem; letter-spacing: 2px; min-width: 80px; text-align: center;}
    
    /* 側邊欄加寬，以容納更大的字體 */
    .sidebar { position: absolute; right: -500px; top: 0; height: 100vh; width: 460px; background: var(--geo-panel); backdrop-filter: blur(15px); padding: 40px 30px; border-left: 2px solid var(--geo-gold); overflow-y: auto; z-index: 2000; box-shadow: -10px 0 30px rgba(0,0,0,0.5); transition: right 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); scroll-behavior: smooth;}
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--geo-gold); border-radius: 3px;}
    .sidebar.open { right: 0; } 
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--geo-text-sub); transition: 0.2s;}
    .close-btn:hover { color: var(--geo-gold-bright); transform: scale(1.1); }
    .story-card { background: transparent; margin-top: 10px; }
    
    .story-tag { display: inline-block; border: 1px solid var(--geo-gold); color: var(--geo-gold-bright); padding: 4px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; margin-bottom: 15px; background: rgba(0,0,0,0.4); }
    .story-tag.holiday-tag { border-color: #ff595e; color: #ffadad; background: rgba(255, 89, 94, 0.15); }
    .story-tag.idiom-tag { border-color: #b5e48c; color: #d9ed92; background: rgba(181, 228, 140, 0.15); }
    .story-tag.poet-tag { border-color: #c77dff; color: #e0aaff; background: rgba(199, 125, 255, 0.15); }

    /* 【重要】字體放大區 */
    .story-title { font-size: 1.8rem; color: var(--geo-text-main); margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);}
    .story-location { font-size: 1.05rem; color: var(--geo-gold); margin-bottom: 15px; font-weight: bold;}
    .story-content { line-height: 1.8; color: var(--geo-text-main); margin-bottom: 20px; font-size: 1.1rem; letter-spacing: 1px;}
    .story-evidence { background: rgba(0,0,0,0.5); padding: 15px; border-left: 3px solid var(--geo-gold); font-size: 1rem; color: var(--geo-text-sub); margin-bottom: 20px; line-height: 1.6;}
    
    .source-btn { display: inline-block; background: transparent; border: 1px solid var(--geo-gold); color: var(--geo-gold); text-decoration: none; padding: 8px 18px; border-radius: 4px; font-size: 0.9rem; transition: 0.3s; margin-right: 10px; margin-bottom: 10px; cursor: pointer;}
    .source-btn:hover { background: var(--geo-gold); color: var(--geo-dark); }
    .custom-map-icon { font-size: 30px; text-align: center; line-height: 30px; filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5)); transition: transform 0.2s; cursor: pointer; }
    .custom-map-icon:hover { transform: scale(1.2); z-index: 1000 !important; }

    details.fp-item { background: rgba(0,0,0,0.4); margin-bottom: 8px; border-radius: 6px; border-left: 3px solid #c77dff; overflow: hidden; transition: background-color 0.5s; }
    details.fp-item summary { font-weight: bold; color: #e0aaff; font-size: 1.1rem; padding: 12px; cursor: pointer; list-style-type: none; display: flex; justify-content: space-between; align-items: center; outline: none; }
    details.fp-item summary::-webkit-details-marker { display: none; }
    details.fp-item summary::after { content: "▼"; font-size: 0.9rem; transition: 0.3s; }
    details.fp-item[open] summary::after { transform: rotate(180deg); }
    .fp-content-box { padding: 0 12px 12px 12px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 5px; }
    .fp-content-box p { font-size: 1rem; color: var(--geo-text-sub); margin: 8px 0; line-height: 1.6; }
    .fp-poem { color: var(--geo-gold-bright) !important; font-style: italic; font-size: 1.05rem !important;}

    /* 編輯器 */
    .toolbar { position: absolute; top: 20px; left: 150px; z-index: 1000; display: flex; gap: 10px; }
    .btn { padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--geo-gold); background: var(--geo-panel); color: var(--geo-gold); backdrop-filter: blur(5px); transition: 0.3s; }
    .btn:hover { background: var(--geo-gold); color: var(--geo-dark); }
    .editor-panel { 
      display: none; position: absolute; top: 70px; left: 150px; width: 400px; 
      background: var(--geo-panel); backdrop-filter: blur(10px); padding: 20px; 
      border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 1000; 
      border: 1px solid var(--geo-gold); max-height: calc(100vh - 100px); overflow-y: auto;
    }
    .editor-panel::-webkit-scrollbar { width: 6px; }
    .editor-panel::-webkit-scrollbar-thumb { background: var(--geo-gold); border-radius: 3px;}
    .editor-panel h3 { margin-bottom: 15px; color: var(--geo-gold-bright); font-size: 1.1rem; border-bottom: 1px solid var(--geo-border); padding-bottom: 8px; display:flex; justify-content: space-between;}
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--geo-text-sub);}
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid var(--geo-border); border-radius: 4px; background: rgba(0,0,0,0.6); color: var(--geo-text-main); font-family: inherit;}
    .editor-actions { display: flex; justify-content: space-between; margin-top: 20px; }
    .editor-actions button { padding: 8px 16px; border: 1px solid var(--geo-gold); border-radius: 4px; cursor: pointer; font-weight: bold; background: transparent; color: var(--geo-gold); transition: 0.3s;}
    .editor-actions button:hover { background: var(--geo-gold); color: var(--geo-dark);}
    
    #dynamicFootprints { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--geo-border); }
    .fp-edit-box { background: rgba(0,0,0,0.3); padding: 10px; margin-bottom: 10px; border-left: 2px solid #c77dff; position: relative; border-radius: 4px;}
    .fp-remove-btn { position: absolute; top: 5px; right: 5px; background: #ff4d4f; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; line-height: 20px; text-align: center;}
    .add-fp-btn { width: 100%; padding: 8px; background: transparent; border: 1px dashed #c77dff; color: #c77dff; border-radius: 4px; cursor: pointer; transition: 0.3s; font-weight: bold; margin-top: 5px;}
    .add-fp-btn:hover { background: rgba(199, 125, 255, 0.2); }
  </style>
</head>
<body>
  <script src="data_myths.js"></script>
  <script src="data_festivals.js"></script>
  <script src="data_idioms.js"></script>
  <script src="data_poets.js"></script>

  <div class="main-container">
    <div class="top-left-panel">
      <div id="categoryBadge" class="category-badge" onclick="toggleCategory()" title="點擊切換維度">神話、童話</div>
      <div class="icon-controls">
        <button id="btnOverview" class="icon-btn active" onclick="toggleOverview()" title="切換：全覽 / 依朝代">👁️</button>
        <button class="icon-btn" onclick="zoomTimeline(1.5)" title="展開時間軸">➕</button>
        <button class="icon-btn" onclick="zoomTimeline(0.66)" title="收攏時間軸">➖</button>
      </div>
    </div>

    <div class="vertical-timeline-container">
      <div class="timeline-scroll-area">
        <div class="timeline-track" id="timelineTrack">
          <input type="range" id="timeSlider" orient="vertical" min="-3000" max="2000" step="1" value="2000">
          <div class="timeline-labels">
            <span style="bottom: 100%">現代</span>
            <span style="bottom: 87.3%">明清</span>
            <span style="bottom: 79.2%">宋元</span>
            <span style="bottom: 72.3%">唐</span>
            <span style="bottom: 55.5%">秦漢</span>
            <span style="bottom: 39%">周</span>
            <span style="bottom: 18.6%">夏商</span>
            <span style="bottom: 0%">神話</span>
          </div>
        </div>
      </div>
      <div id="currentEraDisplay">當前：全覽</div>
      <div id="currentYearDisplay">所有卷宗</div>
    </div>

    <div class="ppt-controls">
      <button class="ppt-btn" onclick="prevStory()" title="上一卷">◀</button>
      <span class="ppt-status" id="pptProgress">- / -</span>
      <button class="ppt-btn" onclick="nextStory()" title="下一卷">▶</button>
    </div>

    <div id="map"></div>
    
    <div class="toolbar">
      <button class="btn" id="btnAdd" onclick="toggleEditMode()">➕ 締結新約</button>
      <button class="btn" onclick="exportData()">📥 拓印卷宗</button>
    </div>

    <div class="editor-panel" id="editorPanel">
      <h3><span id="editorTitle">締結新約</span> <span style="font-size:0.8rem; cursor:pointer;" onclick="cancelEdit()">✖</span></h3>
      <input type="hidden" id="m_id">
      <div style="display:flex; gap:5px;">
        <div class="form-group" style="flex:1;"><label>陣眼(圖示)</label><input type="text" id="m_icon" value="🌟"></div>
        <div class="form-group" style="flex:2;"><label>卷宗名稱</label><input type="text" id="m_title"></div>
      </div>
      <div style="display:flex; gap:5px;">
        <div class="form-group" style="flex:1;">
          <label>卷宗類型</label>
          <select id="m_type" onchange="checkType()">
            <option value="神話、童話">神話、童話</option>
            <option value="節日起源">節日起源</option>
            <option value="成語故事">成語故事</option>
            <option value="詩人軌跡">詩人軌跡</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;"><label>紀元</label><input type="text" id="m_era"></div>
        <div class="form-group" style="flex:1;"><label>年份</label><input type="number" id="m_year"></div>
      </div>
      <div class="form-group"><label>落點區域 (主要)</label><input type="text" id="m_location"></div>
      <div class="form-group"><label>影響省份(用逗號分隔)</label><input type="text" id="m_regions" placeholder="如: 四川,湖北,陝西"></div>
      
      <div class="form-group"><label id="label_content">事蹟 / 簡介</label><textarea id="m_content" rows="2"></textarea></div>
      <div class="form-group"><label id="label_evidence">史籍考證</label><textarea id="m_evidence" rows="2"></textarea></div>
      
      <div class="form-group">
        <label>虛空終端 (網址，一行一個)</label>
        <textarea id="m_link" rows="2" placeholder="https://...\nhttps://..."></textarea>
      </div>
      
      <div id="dynamicFootprints">
        <label style="color: #c77dff; font-weight:bold; margin-bottom:5px; display:block;">✒️ 詩人足跡節點設定</label>
        <div id="fpList"></div>
        <button class="add-fp-btn" onclick="addFpField()">➕ 新增足跡節點</button>
      </div>

      <div class="editor-actions">
        <button onclick="cancelEdit()">取 消</button>
        <button onclick="saveEdit()">銘 記</button>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="close-btn" onclick="closeSidebar()">✖</div>
      <div id="sidebarContent"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const fallbackData = [
      { "id": "m1", "type": "神話、童話", "title": "盤古開天", "icon": "⛰️", "era": "神話時代", "year": -3000, "location": "中原 / 崑崙山脈", "coords": [35.5, 85.5], "regions": ["中國", "台灣"], "content": "天地渾沌如雞子，盤古生在其中。死後身軀化為三山五嶽、江河星辰。", "evidence": "故事背景為宇宙初開。最早文字記載於三國時代徐整的《三五歷紀》。", "link": "https://zh.wikipedia.org/zh-tw/%E7%9B%A4%E5%8F%A4" },
      {
        "id": "p1", "type": "詩人軌跡", "title": "李白 (詩仙)", "icon": "🍶", "era": "唐朝", "year": 701, "location": "四川江油 (出生地)", "coords": [31.78, 104.72], "regions": ["四川", "湖北", "陝西", "河南", "安徽"],
        "content": "李白（701年－762年），字太白，號青蓮居士，唐代偉大的浪漫主義詩人。一生好入名山遊，足跡踏遍大江南北，留下無數千古名篇。",
        "evidence": "《舊唐書·李白傳》。其足跡橫跨蜀中、長安、梁宋、江南與楚地。",
        "link": "https://zh.wikipedia.org/zh-tw/%E6%9D%8E%E7%99%BD",
        "footprints": [
          { "place": "四川江油 (青蓮鄉)", "coords": [31.78, 104.72], "event": "出生與青蓮鄉成長，青年仗劍出蜀漫遊", "poem": "《蜀道難》\n噫吁嚱，危乎高哉！\n蜀道之難，難於上青天！", "translation": "多麼危險高聳！蜀道之難，難於上青天！", "background": "感嘆蜀道艱險。", "anecdote": "賀知章讀後稱其為謫仙人。" }
        ]
      }
    ];

    let rawData = [];
    if (typeof dataMyths !== 'undefined') rawData = rawData.concat(dataMyths);
    if (typeof dataFestivals !== 'undefined') rawData = rawData.concat(dataFestivals);
    if (typeof dataIdioms !== 'undefined') rawData = rawData.concat(dataIdioms);
    if (typeof dataPoets !== 'undefined') rawData = rawData.concat(dataPoets);
    
    // 如果檔案全空，載入備用資料
    if (rawData.length === 0) rawData = fallbackData;
    
    const categories = ["神話、童話", "節日起源", "成語故事", "詩人軌跡"];
    let currentCategoryIndex = 0;
    let filteredStories = [];
    
    function updateFilteredStories() {
      const currentCat = categories[currentCategoryIndex];
      filteredStories = rawData.filter(s => (s.type || "神話、童話") === currentCat).sort((a, b) => a.year - b.year);
    }

    function toggleCategory() {
      currentCategoryIndex = (currentCategoryIndex + 1) % categories.length;
      const cat = categories[currentCategoryIndex];
      const badge = document.getElementById('categoryBadge');
      badge.innerText = cat;
      
      if (cat === "神話、童話") { badge.style.borderColor = "#48cae4"; badge.style.color = "#48cae4"; } 
      else if (cat === "節日起源") { badge.style.borderColor = "#ff595e"; badge.style.color = "#ff595e"; } 
      else if (cat === "成語故事") { badge.style.borderColor = "#b5e48c"; badge.style.color = "#b5e48c"; } 
      else { badge.style.borderColor = "#c77dff"; badge.style.color = "#e0aaff"; }

      updateFilteredStories();
      currentPptIndex = -1;
      document.getElementById('pptProgress').innerText = `0 / ${filteredStories.length}`;
      
      activeRegions = []; hoverRegions = [];
      poetTrajectoryGroup.clearLayers();
      refreshHighlights();
      closeSidebar();
      renderMarkers();
    }

    updateFilteredStories();

    const map = L.map('map', { zoomControl: false, minZoom: 2 }).setView([35.0, 105.0], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', { maxZoom: 18, attribution: '&copy; CARTO' }).addTo(map);

    function updateZoomClass() {
      const z = map.getZoom();
      const container = document.getElementById('map');
      container.className = container.className.replace(/map-zoom-\d+/g, '');
      container.classList.add('map-zoom-' + z);
    }
    map.on('zoomend', updateZoomClass);
    updateZoomClass(); 

    const yellowRiverCoords = [ [34.9, 96.0], [35.5, 97.5], [35.9, 99.0], [36.0, 103.8], [36.6, 104.9], [37.5, 105.1], [38.5, 106.3], [39.3, 106.7], [40.3, 106.9], [40.8, 108.3], [40.6, 110.0], [40.0, 111.3], [39.0, 111.5], [37.8, 110.5], [35.6, 110.6], [34.8, 113.6], [35.0, 114.5], [35.8, 116.0], [36.7, 117.0], [37.5, 118.5], [37.8, 119.0] ];

    let activeRegions = [];

    function refreshHighlights() {
      for(let r in regionLayers) { regionLayers[r].setStyle({ fillOpacity: 0 }); }
      const getActualRegions = (regionsArray) => {
        let res = [];
        regionsArray.forEach(r => { if(r === "中國") res.push(...chinaProvinces); else res.push(r); });
        return res;
      };
      const actualHover = getActualRegions(hoverRegions);
      const actualActive = getActualRegions(activeRegions);

      actualHover.forEach(r => { if(regionLayers[r] && !actualActive.includes(r)) regionLayers[r].setStyle({ fillOpacity: 0.2, fillColor: '#c69c6d' }); });
      actualActive.forEach(r => { if(regionLayers[r]) regionLayers[r].setStyle({ fillOpacity: 0.4, fillColor: '#e2b04a' }); });

    let isEditMode = false;

    function zoomTimeline(factor) {

      document.getElementById('timelineTrack').style.height = currentTrackHeight + 'px';

    function goToStory(index) {
      if(index < 0 || index >= filteredStories.length) return;
      currentPptIndex = index;
      const story = filteredStories[index];

      document.getElementById('timeSlider').value = story.year;
      updateTimelineText();
      if (!isOverviewMode) renderMarkers(); 

      activeRegions = story.regions || [];
      refreshHighlights();

      poetTrajectoryGroup.clearLayers();
      if (story.footprints && story.footprints.length > 0) {
        const lineCoords = story.footprints.map(f => f.coords);
        L.polyline(lineCoords, { color: '#c77dff', weight: 3, dashArray: '6, 8', opacity: 0.9, className: 'glow-path' }).addTo(poetTrajectoryGroup);
        story.footprints.forEach((fp, idx) => {
          const fpIcon = L.divIcon({ html: `<div style="font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); cursor:pointer;">✒️</div>`, className: 'custom-map-icon', iconSize: [28, 28], iconAnchor: [14, 14] });
          const fpMarker = L.marker(fp.coords, { icon: fpIcon }).addTo(poetTrajectoryGroup);
          fpMarker.bindTooltip(`<b>${fp.place}</b>`, { permanent: false, direction: 'top' });
          
          fpMarker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            const detailEl = document.getElementById(`fp-detail-${idx}`);
            if(detailEl) {
              if(!sidebar.classList.contains('open')) sidebar.classList.add('open');
              detailEl.open = true;
              setTimeout(() => {
                detailEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                detailEl.style.transition = 'background-color 0.5s';
                detailEl.style.backgroundColor = 'rgba(199, 125, 255, 0.4)';
                setTimeout(() => detailEl.style.backgroundColor = 'rgba(0,0,0,0.4)', 1500);
              }, 100); 
            }
          });
        });
      }

      showStoryDetails(story);
      map.flyTo(story.coords, 5, { duration: 1.2 });
      document.getElementById('pptProgress').innerText = `卷 ${index + 1} / ${filteredStories.length}`;
    }

    function nextStory() { if(filteredStories.length === 0) return; let nextIdx = currentPptIndex + 1; if(nextIdx >= filteredStories.length) nextIdx = 0; goToStory(nextIdx); }
    function prevStory() { if(filteredStories.length === 0) return; let prevIdx = currentPptIndex - 1; if(prevIdx < 0) prevIdx = filteredStories.length - 1; goToStory(prevIdx); }
    function getEraByYear(year) { return eras.find(e => year >= e.start && year <= e.end) || eras[eras.length - 1]; }

    function updateTimelineText() {
      const currentYear = parseInt(document.getElementById('timeSlider').value);
      const currentEra = getEraByYear(currentYear);
      const yearText = currentYear < 0 ? `西元前 ${Math.abs(currentYear)} 年` : `西元 ${currentYear} 年`;
      if (isOverviewMode) {
        document.getElementById('currentEraDisplay').innerText = "當前：全覽"; document.getElementById('currentYearDisplay').innerText = "所有卷宗";
      } else {
        document.getElementById('currentEraDisplay').innerText = `紀元：${currentEra.name}`; document.getElementById('currentYearDisplay').innerText = yearText;
      }
    }

    }

    document.getElementById('timeSlider').addEventListener('input', () => {
      if (isOverviewMode) toggleOverview(); 
      updateTimelineText(); renderMarkers();
    });

    function renderMarkers() {
      markersGroup.clearLayers();
      const currentYear = parseInt(document.getElementById('timeSlider').value);
      const currentEra = getEraByYear(currentYear);

      filteredStories.forEach(story => {
        if (!isOverviewMode && (story.year < currentEra.start || story.year > currentEra.end)) return;
        const customIcon = L.divIcon({ html: `<div>${story.icon}</div>`, className: 'custom-map-icon', iconSize: [36, 36], iconAnchor: [18, 18] });
        const marker = L.marker(story.coords, { icon: customIcon }).addTo(markersGroup);
        
        marker.on('mouseover', () => { hoverRegions = story.regions || []; refreshHighlights(); });
        marker.on('mouseout', () => { hoverRegions = []; refreshHighlights(); });
        marker.on('click', (e) => { L.DomEvent.stopPropagation(e); if(isEditMode) return; goToStory(filteredStories.findIndex(s => s.id === story.id)); });
      });
    }

    const sidebar = document.getElementById('sidebar');
    function showStoryDetails(story) {
      const yearText = story.year < 0 ? `西元前 ${Math.abs(story.year)} 年` : `西元 ${story.year} 年`;
      
      let linkBtns = '';
      if (story.link) {
        const links = story.link.split('\n').map(l => l.trim()).filter(l => l);
        links.forEach((l, i) => { linkBtns += `<a href="${l}" target="_blank" class="source-btn">🔗 查閱終端 ${links.length > 1 ? (i+1) : ''}</a>`; });

      const sType = story.type || "神話、童話";
      let typeClass = "";
      if (sType === "節日起源") typeClass = "holiday-tag";
      if (sType === "成語故事") typeClass = "idiom-tag";

            </details>

          <div class="story-location">📍 落點：${story.location}</div>
          <p class="story-content">${story.content}</p>
          <div class="story-evidence"><strong id="side_evi_label">📜 史籍考證：</strong><br>${story.evidence || "佚失"}</div>
          ${linkBtns}
          ${footprintHtml}
        </div>
      `;
      if (sType === '詩人軌跡') { document.getElementById('side_evi_label').innerText = "📜 生平考證來源："; }
      
      sidebar.classList.add('open');

    function editExistingStory(id) {
      const story = rawData.find(s => s.id === id);

      document.getElementById('editorTitle').innerText = "✏️ 編輯卷宗";
      document.getElementById('m_icon').value = story.icon;
      document.getElementById('m_title').value = story.title;
      document.getElementById('m_type').value = story.type || "神話、童話";
      document.getElementById('m_era').value = story.era;
      document.getElementById('m_year').value = story.year;
      document.getElementById('m_location').value = story.location;
      document.getElementById('m_regions').value = (story.regions || []).join(', ');
      document.getElementById('m_content').value = story.content;
      document.getElementById('m_evidence').value = story.evidence || '';
      document.getElementById('m_link').value = story.link || '';
      
      document.getElementById('fpList').innerHTML = '';
      if(story.footprints) story.footprints.forEach(fp => addFpField(fp));
      checkType();

      isEditMode = true;
      const btn = document.getElementById('btnAdd');
      btn.innerText = "❌ 中止締約"; btn.style.borderColor = "#ff4d4f"; btn.style.color = "#ff4d4f";
      
      if(tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker(story.coords, { draggable: true }).addTo(map);
      
      document.getElementById('editorPanel').style.display = 'block';
      document.getElementById('map').classList.remove('map-edit-mode');
      closeSidebar();
    }

    map.on('click', function(e) {
      if(!isEditMode) return;
      if(tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker(e.latlng, { draggable: true }).addTo(map);
      document.getElementById('editorPanel').style.display = 'block';
      document.getElementById('map').classList.remove('map-edit-mode');
    });

    function cancelEdit() {
      isEditMode = false; editingId = null;
      const btn = document.getElementById('btnAdd');
      btn.innerText = "➕ 締結新約"; btn.style.borderColor = "var(--geo-gold)"; btn.style.color = "var(--geo-gold)";
      document.getElementById('map').classList.remove('map-edit-mode');
      document.getElementById('editorPanel').style.display = 'none';
      if(tempMarker) map.removeLayer(tempMarker);
      tempMarker = null;
    }

    function saveEdit() {
      if(!tempMarker) return alert("請先於地圖點定陣眼！");
      const regionInput = document.getElementById('m_regions').value;
      const regionsArray = regionInput ? regionInput.split(',').map(s => s.trim()) : ["中國"];
      
      let footprintsArray = [];
      if(document.getElementById('m_type').value === '詩人軌跡') {
        const fpBoxes = document.querySelectorAll('.fp-edit-box');
        fpBoxes.forEach(box => {
          const lat = parseFloat(box.querySelector('.fp-lat').value);
          const lng = parseFloat(box.querySelector('.fp-lng').value);
          if(!isNaN(lat) && !isNaN(lng)) {
            footprintsArray.push({
              place: box.querySelector('.fp-place').value,
              coords: [lat, lng],
              background: box.querySelector('.fp-event').value,
              poem: box.querySelector('.fp-poem').value,
              translation: box.querySelector('.fp-trans').value,
              anecdote: box.querySelector('.fp-anecdote').value
            });
          }
        });
      }
      
      const newMyth = {
        id: editingId || ("m" + Date.now()),
        type: document.getElementById('m_type').value || "神話、童話",
        title: document.getElementById('m_title').value || "未知卷宗",
        icon: document.getElementById('m_icon').value || "📍",
        era: document.getElementById('m_era').value || "未知",
        year: parseInt(document.getElementById('m_year').value) || 0,
        location: document.getElementById('m_location').value || "未知",
        coords: [parseFloat(tempMarker.getLatLng().lat.toFixed(4)), parseFloat(tempMarker.getLatLng().lng.toFixed(4))],
        regions: regionsArray,
        content: document.getElementById('m_content').value,
        evidence: document.getElementById('m_evidence').value,
        link: document.getElementById('m_link').value,
        footprints: footprintsArray.length > 0 ? footprintsArray : undefined
      };

      if(editingId) {
        const idx = rawData.findIndex(s => s.id === editingId);
        if(idx !== -1) rawData[idx] = newMyth;
      } else {
        rawData.push(newMyth);
      }

      updateFilteredStories(); 
      cancelEdit();
      renderMarkers();
    }

    function exportData() {
      // 1. 將目前的資料依照類型分類
      const myths = rawData.filter(d => d.type === "神話、童話");
      const festivals = rawData.filter(d => d.type === "節日起源");
      const idioms = rawData.filter(d => d.type === "成語故事");
      const poets = rawData.filter(d => d.type === "詩人軌跡");

      // 2. 建立一個專門用來下載的小工具函數
      const downloadFile = (filename, varName, dataArray) => {
        if(dataArray.length === 0) return; // 如果該分類沒資料就不下載
        const fileContent = `const ${varName} = ${JSON.stringify(dataArray, null, 2)};`;
        const blob = new Blob([fileContent], { type: "text/javascript;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 3. 觸發四次下載，分別產生四個檔案
      downloadFile("data_myths.js", "dataMyths", myths);
      downloadFile("data_festivals.js", "dataFestivals", festivals);
      downloadFile("data_idioms.js", "dataIdioms", idioms);
      downloadFile("data_poets.js", "dataPoets", poets);
      
      alert("✅ 拓印完成！已將最新卷宗自動拆分為四個檔案下載，請確認瀏覽器的下載區。");
    }
    renderMarkers();
    document.getElementById('pptProgress').innerText = `0 / ${filteredStories.length}`;
  </script>
</body>
</html>
